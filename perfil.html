<!DOCTYPE html>
<!--
    ARQUIVO: perfil.html
    ---------------------------------------------------------------
    Página "Meu Perfil". Tem duas partes controladas por
    js/pagina-perfil.js:
      1. Nome e e-mail da pessoa logada, lidos da sessão criada no
         login (sessionStorage) — não são mais digitados aqui, vêm
         do cadastro/login.
      2. A lista de cursos que a pessoa marcou como favoritos (★) em
         qualquer outra página do site (cursos.html, resultado.html).
         Como os favoritos também ficam salvos no localStorage, essa
         lista funciona mesmo sem nenhum login — mas só existe NAQUELE
         navegador/dispositivo específico.
-->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximo Passo | Meu Perfil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="imagens/logo.jpeg" alt="Logo Próximo Passo" class="logo-img">
            <span>Próximo Passo</span>
        </div>
        <nav>
            <a href="inicio.html">Início</a>
            <a href="quiz.html">Quiz</a>
            <a href="cursos.html">Cursos</a>
            <a href="comparacao.html">Comparação</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <!-- Cabeçalho do perfil: avatar (emoji fixo) + saudação + campo de nome.
             O texto do <h2 id="perfil-saudacao"> e o valor do input são
             preenchidos/atualizados via JavaScript a partir do que estiver
             salvo no localStorage (ou vazio, na primeira visita). -->
        <section class="perfil-header">
            <div class="perfil-avatar">🎓</div>
            <div class="perfil-info">
                <h2 id="perfil-saudacao">Olá! 👋</h2>
                <p id="perfil-email" class="perfil-email"></p>
            </div>
            <button id="botao-sair" class="btn-card" style="margin-left: auto;">Sair</button>
        </section>

        <h2>⭐ Meus Cursos Favoritos</h2>
        <p style="text-align: center; margin-bottom: 30px;">
            Cursos que você marcou com a estrela ficam salvos aqui, neste navegador.
        </p>

        <!-- Nasce vazia; js/pagina-perfil.js decide o que colocar aqui:
             ou a mensagem "você ainda não favoritou nada" ou a grid com
             os cards dos cursos favoritados -->
        <div id="lista-favoritos"></div>
    </main>

    <footer>
        <p>&copy; 2026 - Próximo Passo - Projeto de TCC</p>
    </footer>

    <!-- dados.js primeiro (fornece getFavoritos, getCursoPorId,
         renderCursoCard, ativarBotoesFavoritar/Comparar, carregarCursos
         e a chave PERFIL_NOME_KEY); pagina-perfil.js depois -->
    <script src="js/dados.js"></script>
    <script src="js/pagina-perfil.js"></script>
</body>
</html>
