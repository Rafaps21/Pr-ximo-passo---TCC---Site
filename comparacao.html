<!DOCTYPE html>
<!--
    ARQUIVO: comparacao.html
    ---------------------------------------------------------------
    Página que permite comparar até 4 cursos lado a lado. Igual às
    outras páginas dinâmicas do site, o painel de comparação
    (#painel-comparativo) nasce vazio no HTML e é preenchido pelo
    js/pagina-comparacao.js com 4 "slots" (select + coluna de dados).
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximo Passo | Comparação de Carreiras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="imagens/logo.jpeg" alt="Logo Próximo Passo" class="logo-img">
            <span>Próximo Passo</span>
        </div>
        <nav>
            <a href="inicio.html">Início</a>
            <a href="quiz.html">Quiz</a>
            <a href="cursos.html">Cursos</a>
            <a href="comparacao.html">Comparação</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="hero-texto">
            <h1>Compare as <span>Carreiras</span></h1>
            <p>
                Selecione até 4 cursos abaixo para comparar lado a lado: carga horária, salário médio,
                duração, instituições e mensalidade.
            </p>
        </section>

        <!-- Botão que zera os 4 selects e volta todas as colunas para
             o estado "vazio" (placeholder). O comportamento de clique
             é ligado em js/pagina-comparacao.js. type="button" evita
             que o clique tente enviar algum formulário. -->
        <div class="btn-limpar-wrapper">
            <button id="btn-limpar-comparacao" class="btn-secundario" type="button">Limpar comparação</button>
        </div>

        <!-- Painel montado em branco pelo js/pagina-comparacao.js; a pessoa
             escolhe os cursos nos selects que o script cria aqui dentro.
             Se a pessoa chegou até aqui clicando em "Comparar Este" em
             algum card de outra página, o primeiro slot já vem
             pré-preenchido automaticamente (leia os comentários dentro
             do próprio pagina-comparacao.js para entender como). -->
        <div id="painel-comparativo" class="painel-comparativo"></div>
    </main>

    <footer>
        <p>&copy; 2026 - Próximo Passo - Projeto de TCC</p>
    </footer>

    <!-- dados.js primeiro (fornece CURSOS, carregarCursos, getCursoPorId
         e a chave COMPARAR_INICIAL_KEY); pagina-comparacao.js depois -->
    <script src="js/dados.js"></script>
    <script src="js/pagina-comparacao.js"></script>
</body>
</html>
